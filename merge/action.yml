name: 'NixCache OCI Merge Coordinator'
description: 'Download Build Receipts from matrix workers, merge index entries & GC roots, and publish the global cache-index to GHCR'
inputs:
  registry:
    description: 'OCI Registry to push cache-index to'
    required: false
    default: 'ghcr.io'
  repo:
    description: 'Target repository name (owner/repo)'
    required: false
    default: ${{ github.repository }}
  receipts-dir:
    description: 'Directory where build receipts are downloaded'
    required: false
    default: ''
  github-token:
    description: 'GitHub token with package write permissions'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Verify Nix Installation
      shell: bash
      run: |
        if ! command -v nix &> /dev/null; then
          echo "::error::Nix is not installed. Please use DeterminateSystems/nix-installer-action before calling this action."
          exit 1
        fi

    - name: Log in to OCI Registry
      shell: bash
      run: |
        echo "${{ inputs.github-token }}" | docker login ${{ inputs.registry }} -u "${{ github.actor }}" --password-stdin

    - name: Download Build Receipt Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ inputs.receipts-dir != '' && inputs.receipts-dir || format('{0}/receipts', runner.temp) }}
        pattern: 'nixcache-receipt-*'
        merge-multiple: true

    - name: Merge Receipts & Publish Global Index
      shell: bash
      env:
        NIXCACHE_RECEIPTS_DIR: ${{ inputs.receipts-dir != '' && inputs.receipts-dir || format('{0}/receipts', runner.temp) }}
        NIXCACHE_REPO: ${{ inputs.repo }}
        NIXCACHE_REGISTRY: ${{ inputs.registry }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        REF=""
        if [[ -f .nixcache-version ]]; then
          REF=$(cat .nixcache-version | tr -d '[:space:]')
          if [[ -n "$REF" ]]; then
            echo ">>> Found .nixcache-version file, using version: $REF"
          fi
        fi
        if [[ -z "$REF" ]]; then
          REF="${{ github.action_ref }}"
          if [[ -z "$REF" ]]; then
            REF="main"
          fi
          echo ">>> Using fallback version: $REF"
        fi
        nix run "github:shaogme/nixcache-oci/$REF#cache-builder-bin" -- merge
