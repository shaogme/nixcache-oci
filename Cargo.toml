[workspace]
resolver = "3"
members = [
    "crates/nixcache-utils",
    "crates/nixcache-core",
    "crates/nixcache-oci",
    "crates/nixcache-proxy",
    "crates/nixcache-builder",
    "crates/nixcache-worker",
    "crates/nixcache-oci-backend",
]

[workspace.dependencies]
nixcache-utils = { path = "crates/nixcache-utils" }
nixcache-core = { path = "crates/nixcache-core" }
nixcache-oci = { path = "crates/nixcache-oci", default-features = false }
nixcache-oci-backend = { path = "crates/nixcache-oci-backend", default-features = false }
async-trait = "0.1"
bytes = "1"
http = "1"
axum = { version = "0.8", features = ["http2"] }
tokio = { version = "1" }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
futures-util = "0.3"
futures-channel = "0.3"
futures-executor = "0.3"
tokio-util = { version = "0.7" }
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.17"
thiserror = "2.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
async-compression = { version = "0.4", features = ["tokio", "xz", "zstd"] }
zstd = "0.13"
ruzstd = "0.7"
web-time = "1.1"
arc-swap = "1.7"
scc = "2.3"
crossbeam-queue = "0.3"
loom = "0.7"
