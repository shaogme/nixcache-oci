[workspace]
resolver = "3"
members = [
    "crates/nixcache-utils",
    "crates/nixcache-core",
    "crates/nixcache-oci",
    "crates/nixcache-proxy",
    "crates/nixcache-builder",
    "crates/nixcache-worker",
    "crates/nixcache-oci-backend",
]

[workspace.dependencies]
# Workspace crates
nixcache-core = { path = "crates/nixcache-core" }
nixcache-oci = { path = "crates/nixcache-oci", default-features = false }
nixcache-oci-backend = { path = "crates/nixcache-oci-backend", default-features = false }
nixcache-utils = { path = "crates/nixcache-utils" }

# Async runtime & networking
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
bytes = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1" }
tokio-util = { version = "0.7" }
tower = { version = "0.5", features = ["util"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrency & Synchronization
arc-swap = "1.9"
crossbeam-queue = "0.3"
loom = "0.7"
scc = "3.8"

# Compression
async-compression = { version = "0.4", features = ["tokio", "xz", "zstd"] }
ruzstd = "0.9"
zstd = "0.13"

# Observability
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities & Error handling
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
num_cpus = "1.17"
sha2 = "0.11"
strum = { version = "0.27", features = ["derive"] }
tempfile = "3"
thiserror = "2.0"
web-time = "1.1"

# Testing
wiremock = "0.6"

[profile.test]
opt-level = 2
