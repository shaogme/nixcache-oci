name: Garbage Collect Cache

on:
  schedule:
    - cron: '0 3 * * 0'   # weekly, Sunday 3am UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Delete entries older than N days not in active closure'
        required: false
        default: '30'
        type: string
      dry_run:
        description: 'Show what would be deleted without applying changes'
        required: false
        default: true
        type: boolean
      delete_blobs:
        description: 'Attempt physical OCI blob deletion'
        required: false
        default: false
        type: boolean
      allow_unsupported_blob_deletion:
        description: 'Allow skipping blob deletion if registry does not support it (e.g. GHCR)'
        required: false
        default: false
        type: boolean
      strict:
        description: 'Strict error handling mode (fail on missing references)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  gc:
    name: Run Garbage Collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install NixCache Tools
        uses: ./install

      - name: Execute Garbage Collection
        env:
          NIXCACHE_REPO: ${{ github.repository }}
          NIXCACHE_REGISTRY: 'ghcr.io'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RETENTION_DAYS="${{ github.event.inputs.retention_days || '30' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          DELETE_BLOBS="${{ github.event.inputs.delete_blobs || 'false' }}"
          ALLOW_UNSUPPORTED="${{ github.event.inputs.allow_unsupported_blob_deletion || 'false' }}"
          STRICT="${{ github.event.inputs.strict || 'true' }}"

          ARGS=(--retention-days "$RETENTION_DAYS")
          if [[ "$DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          if [[ "$DELETE_BLOBS" == "true" ]]; then
            ARGS+=(--delete-blobs)
          fi
          if [[ "$ALLOW_UNSUPPORTED" == "true" ]]; then
            ARGS+=(--allow-unsupported-blob-deletion)
          fi
          if [[ "$STRICT" == "false" ]]; then
            ARGS+=(--no-strict)
          fi

          echo ">>> Executing nixcache-builder gc with retention: ${RETENTION_DAYS}d, dry_run: ${DRY_RUN}"
          nixcache-builder gc "${ARGS[@]}"
