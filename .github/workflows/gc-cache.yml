name: Garbage Collect Cache

on:
  schedule:
    - cron: '0 3 * * 0'   # weekly, Sunday 3am UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Delete entries older than N days not in current closure'
        default: '30'
        type: string
      dry_run:
        description: 'Show what would be deleted without deleting'
        default: true
        type: boolean
      delete_blobs:
        description: 'Attempt physical OCI blob deletion'
        default: false
        type: boolean
      allow_unsupported_blob_deletion:
        description: 'Allow skipping blob deletion if registry does not support it (e.g. GHCR)'
        default: false
        type: boolean
      strict:
        description: 'Strict error handling mode (default true)'
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install NixCache Tools
        uses: ./install

      - name: Load Environment Variables
        run: |
          chmod +x scripts/load-env.sh
          ./scripts/load-env.sh flake
          
          if [[ -z "${NIXCACHE_REPO:-}" ]]; then
            echo "NIXCACHE_REPO=${{ github.repository }}" >> "$GITHUB_ENV"
          fi
          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
            echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"
          fi

      - name: Run garbage collection
        run: |
          RETENTION_DAYS="${{ github.event.inputs.retention_days || '30' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          DELETE_BLOBS="${{ github.event.inputs.delete_blobs || 'false' }}"
          ALLOW_UNSUPPORTED="${{ github.event.inputs.allow_unsupported_blob_deletion || 'false' }}"
          STRICT="${{ github.event.inputs.strict || 'true' }}"
          
          EXTRA_ARGS=()
          if [[ "$DRY_RUN" == "true" ]]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          if [[ "$DELETE_BLOBS" == "true" ]]; then
            EXTRA_ARGS+=(--delete-blobs)
          fi
          if [[ "$ALLOW_UNSUPPORTED" == "true" ]]; then
            EXTRA_ARGS+=(--allow-unsupported-blob-deletion)
          fi
          if [[ "$STRICT" == "false" ]]; then
            EXTRA_ARGS+=(--no-strict)
          fi
          
          nixcache-builder gc --retention-days "$RETENTION_DAYS" "${EXTRA_ARGS[@]}"


