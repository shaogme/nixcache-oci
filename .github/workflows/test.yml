name: Test & CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  static-and-lint:
    name: 1. Static Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: actions/cache@main
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Rust Code Format Check
        run: cargo fmt --check

      - name: Clippy Linter Check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts ./test"

      - name: Run ActionLint
        uses: raven-actions/actionlint@v2

  cargo-unit-tests:
    name: 2. Cargo Workspace Unit Tests
    runs-on: ubuntu-latest
    needs: static-and-lint
    steps:
      - uses: actions/checkout@main

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@main
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run Cargo Workspace Unit & Mock Tests
        run: cargo test --workspace --verbose

  loom-concurrency-verification:
    name: 3. Loom Formal Concurrency Verification
    runs-on: ubuntu-latest
    needs: static-and-lint
    steps:
      - uses: actions/checkout@main

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@main
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-loom-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-loom-

      - name: Run Loom Formal Model Checking Integration Tests
        run: RUSTFLAGS="--cfg loom" cargo test -p nixcache-oci --features loom --test token_loom -- --nocapture

  nix-static-checks:
    name: 4. Nix Module Static Checks
    runs-on: ubuntu-latest
    needs: static-and-lint
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run NixOS Module evalConfig Static Check
        run: nix-build default.nix -A tests.static --no-out-link

  nixos-vm-tests:
    name: 5. NixOS VM Driver & Service Tests
    runs-on: ubuntu-latest
    needs: [cargo-unit-tests, loom-concurrency-verification, nix-static-checks]
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run NixOS VM Test
        run: nix-build default.nix -A tests.vmtest --no-out-link

  single-runner-e2e:
    name: 5. Single Runner E2E (${{ matrix.build_mode }} / ${{ matrix.test_mode }})
    runs-on: ubuntu-latest
    needs: nixos-vm-tests
    strategy:
      fail-fast: false
      matrix:
        build_mode: [cargo, nix-source, nix-bin]
        test_mode: [flake, legacy]
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run E2E Test
        run: |
          chmod +x test/test-e2e.sh
          ./test/test-e2e.sh ${{ matrix.build_mode }} ${{ matrix.test_mode }}

  multiarch-e2e:
    name: 6. Multi-Arch Scatter-Gather E2E Test
    runs-on: ubuntu-latest
    needs: nixos-vm-tests
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run Multi-Arch E2E Test
        run: |
          chmod +x test/test-multiarch-e2e.sh
          ./test/test-multiarch-e2e.sh

  resilience-e2e:
    name: 7. Resilience & Multi-Backend E2E Tests
    runs-on: ubuntu-latest
    needs: nixos-vm-tests
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run OCI Multi-Backend Determinism Test
        run: |
          chmod +x test/test-backends-determinism.sh
          ./test/test-backends-determinism.sh

      - name: Run Fault Tolerance & Upstream Fallback Test
        run: |
          chmod +x test/test-fault-tolerance.sh
          ./test/test-fault-tolerance.sh

      - name: Run Security Signature Verification Test
        run: |
          chmod +x test/test-security-signature.sh
          ./test/test-security-signature.sh

      - name: Run Concurrency Merge & GC Roots Test
        run: |
          chmod +x test/test-concurrency-merge.sh
          ./test/test-concurrency-merge.sh

      - name: Run Schema v4 Session CAS & Cascading Pipeline Test
        run: |
          chmod +x test/test-pipeline-session-cas.sh
          ./test/test-pipeline-session-cas.sh

      - name: Run Cache Purge & Invalidation CAS Integration Test
        run: |
          chmod +x test/test-purge-cas.sh
          ./test/test-purge-cas.sh

  test-worker:
    name: 8. Cloudflare Worker E2E Test
    runs-on: ubuntu-latest
    needs: nixos-vm-tests
    if: github.repository == 'shaogme/nixcache-oci'
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run Worker E2E Test
        env:
          TEST_WORKER_URL: ${{ secrets.TEST_WORKER_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x test/test-worker.sh
          ./test/test-worker.sh
