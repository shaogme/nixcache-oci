name: CI Quality & Test Gate

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'nix/binaries.json'
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # 阶段 0: 静态质量与快速检查 (Fail-Fast)
  # =========================================================================
  static-and-lint:
    name: 0. Static Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: actions/cache@main
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Rust Code Format Check
        run: cargo fmt --check

      - name: Clippy Linter Check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./test ./install"

      - name: Run ActionLint
        uses: raven-actions/actionlint@v2

  cargo-unit-tests:
    name: 0. Cargo Workspace Unit Tests
    runs-on: ubuntu-latest
    needs: static-and-lint
    steps:
      - uses: actions/checkout@main

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@main
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-unit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-unit-

      - name: Run Cargo Unit & Mock Tests
        run: cargo test --workspace --verbose

  loom-concurrency:
    name: 0. Loom Formal Concurrency Model Checking
    runs-on: ubuntu-latest
    needs: static-and-lint
    steps:
      - uses: actions/checkout@main

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Loom Tests
        run: RUSTFLAGS="--cfg loom" cargo test -p nixcache-oci --features loom --test token_loom -- --nocapture

  # =========================================================================
  # 阶段 1: 本地测试专用 Host 二进制构建 (仅 Linux x86_64)
  # =========================================================================
  build-ci-binaries:
    name: 1. Build Host Test Binaries (x86_64-linux)
    runs-on: ubuntu-latest
    needs: static-and-lint
    steps:
      - uses: actions/checkout@main

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild

      - name: Build Binaries
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-musl --bin nixcache-proxy
          cargo zigbuild --release --target x86_64-unknown-linux-musl --bin nixcache-builder

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/nixcache-proxy dist/nixcache-proxy-x86_64-linux
          cp target/x86_64-unknown-linux-musl/release/nixcache-builder dist/nixcache-builder-x86_64-linux

      - name: Upload Host Binary Artifact
        uses: actions/upload-artifact@main
        with:
          name: binary-x86_64-unknown-linux-musl
          path: dist/*
          retention-days: 1
          overwrite: true

  # =========================================================================
  # 阶段 2: 全套集成与端到端测试 (完全自闭环)
  # =========================================================================
  nix-static-checks:
    name: 2. Nix Module Static Checks
    runs-on: ubuntu-latest
    needs: [build-ci-binaries]
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run NixOS Module evalConfig Static Check
        run: nix-build default.nix -A tests.static --no-out-link

  nixos-vm-tests:
    name: 2. NixOS VM Driver & Service Tests
    runs-on: ubuntu-latest
    needs: [nix-static-checks]
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Run NixOS VM Test
        run: nix-build default.nix -A tests.vmtest --no-out-link

  single-runner-e2e:
    name: 2. Single Runner E2E (${{ matrix.build_mode }} / ${{ matrix.test_mode }})
    runs-on: ubuntu-latest
    needs: [build-ci-binaries]
    strategy:
      fail-fast: false
      matrix:
        build_mode: [nix-bin]
        test_mode: [flake, legacy]
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Download Pre-compiled Binaries
        uses: actions/download-artifact@main
        with:
          name: binary-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/bin

      - name: Setup Binaries
        run: |
          chmod +x ${{ runner.temp }}/bin/*
          cp "${{ runner.temp }}/bin/nixcache-builder-x86_64-linux" "${{ runner.temp }}/bin/nixcache-builder"
          cp "${{ runner.temp }}/bin/nixcache-proxy-x86_64-linux" "${{ runner.temp }}/bin/nixcache-proxy"

      - name: Run E2E Test
        env:
          PRECOMPILED_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          chmod +x test/test-e2e.sh
          ./test/test-e2e.sh ${{ matrix.build_mode }} ${{ matrix.test_mode }}

  multiarch-e2e:
    name: 2. Multi-Arch Scatter-Gather E2E Test
    runs-on: ubuntu-latest
    needs: [build-ci-binaries]
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Download Pre-compiled Binaries
        uses: actions/download-artifact@main
        with:
          name: binary-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/bin

      - name: Setup Binaries
        run: |
          chmod +x ${{ runner.temp }}/bin/*
          cp "${{ runner.temp }}/bin/nixcache-builder-x86_64-linux" "${{ runner.temp }}/bin/nixcache-builder"
          cp "${{ runner.temp }}/bin/nixcache-proxy-x86_64-linux" "${{ runner.temp }}/bin/nixcache-proxy"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Run Multi-Arch E2E Test
        env:
          PRECOMPILED_BIN_DIR: ${{ runner.temp }}/bin
          BUILDER_BIN: ${{ runner.temp }}/bin/nixcache-builder-x86_64-linux
          PROXY_BIN: ${{ runner.temp }}/bin/nixcache-proxy-x86_64-linux
        run: |
          chmod +x test/test-multiarch-e2e.sh
          ./test/test-multiarch-e2e.sh

  resilience-e2e:
    name: 2. Resilience & Multi-Backend E2E Tests
    runs-on: ubuntu-latest
    needs: [build-ci-binaries]
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Download Pre-compiled Binaries
        uses: actions/download-artifact@main
        with:
          name: binary-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/bin

      - name: Setup Binaries
        run: |
          chmod +x ${{ runner.temp }}/bin/*
          cp "${{ runner.temp }}/bin/nixcache-builder-x86_64-linux" "${{ runner.temp }}/bin/nixcache-builder"
          cp "${{ runner.temp }}/bin/nixcache-proxy-x86_64-linux" "${{ runner.temp }}/bin/nixcache-proxy"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Run OCI Multi-Backend Determinism Test
        env:
          PRECOMPILED_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          chmod +x test/test-backends-determinism.sh
          ./test/test-backends-determinism.sh

      - name: Run Fault Tolerance & Upstream Fallback Test
        env:
          PRECOMPILED_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          chmod +x test/test-fault-tolerance.sh
          ./test/test-fault-tolerance.sh

      - name: Run Security Signature Verification Test
        env:
          PRECOMPILED_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          chmod +x test/test-security-signature.sh
          ./test/test-security-signature.sh

      - name: Run Concurrency Merge & GC Roots Test
        env:
          PRECOMPILED_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          chmod +x test/test-concurrency-merge.sh
          ./test/test-concurrency-merge.sh

      - name: Run Schema v5 Session CAS & Cascading Pipeline Test
        env:
          PRECOMPILED_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          chmod +x test/test-pipeline-session-cas.sh
          ./test/test-pipeline-session-cas.sh

      - name: Run Cache Purge & Invalidation CAS Integration Test
        env:
          PRECOMPILED_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          chmod +x test/test-purge-cas.sh
          ./test/test-purge-cas.sh

      - name: Run Capture Redesign & Runtime Closure Test
        env:
          PRECOMPILED_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          chmod +x test/test-capture-closure.sh
          ./test/test-capture-closure.sh

      - name: Run Install Action & Script Test
        run: |
          chmod +x test/test-install-action.sh
          ./test/test-install-action.sh

  test-worker:
    name: 2. Cloudflare Worker E2E Test
    runs-on: ubuntu-latest
    needs: [build-ci-binaries]
    if: github.repository == 'shaogme/nixcache-oci'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Download Pre-compiled Binaries
        uses: actions/download-artifact@main
        with:
          name: binary-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/bin

      - name: Setup Binaries
        run: |
          chmod +x ${{ runner.temp }}/bin/*
          cp "${{ runner.temp }}/bin/nixcache-builder-x86_64-linux" "${{ runner.temp }}/bin/nixcache-builder"
          cp "${{ runner.temp }}/bin/nixcache-proxy-x86_64-linux" "${{ runner.temp }}/bin/nixcache-proxy"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Run Worker E2E Test
        env:
          PRECOMPILED_BIN_DIR: ${{ runner.temp }}/bin
          TEST_WORKER_URL: ${{ secrets.TEST_WORKER_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x test/test-worker.sh
          ./test/test-worker.sh

  # =========================================================================
  # 阶段 3: 最终门禁 (Final CI Success Gate)
  # =========================================================================
  ci-success:
    name: 3. CI Success Gate
    runs-on: ubuntu-latest
    needs:
      - static-and-lint
      - cargo-unit-tests
      - loom-concurrency
      - build-ci-binaries
      - nix-static-checks
      - nixos-vm-tests
      - single-runner-e2e
      - multiarch-e2e
      - resilience-e2e
      - test-worker
    if: always()
    steps:
      - name: Verify All Preceding CI Jobs Succeeded
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          echo "Checking status of all pipeline jobs..."
          echo "$NEEDS_CONTEXT" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          failed_jobs=$(echo "$NEEDS_CONTEXT" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')

          if [ -n "$failed_jobs" ]; then
            echo "::error::The following required jobs did not succeed: $failed_jobs"
            exit 1
          fi

          echo "All required CI jobs succeeded or were legitimately skipped."
