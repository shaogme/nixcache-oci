name: 'NixCache OCI Garbage Collector'
description: 'Perform cross-architecture graph reachability garbage collection on cache-index'
inputs:
  retention-days:
    description: 'Delete entries older than N days not in current closure'
    required: false
    default: '30'
  dry-run:
    description: 'Dry run mode (show what would be deleted without deleting)'
    required: false
    default: 'false'
  delete-blobs:
    description: 'Attempt physical OCI blob deletion'
    required: false
    default: 'false'
  allow-unsupported-blob-deletion:
    description: 'Allow skipping blob deletion if registry does not support standalone blob deletion (e.g. GHCR)'
    required: false
    default: 'false'
  strict:
    description: 'Strict error handling mode (default true)'
    required: false
    default: 'true'
  repo:
    description: 'Target repository name (owner/repo)'
    required: false
    default: ${{ github.repository }}
  registry:
    description: 'OCI Registry'
    required: false
    default: 'ghcr.io'
  registry-kind:
    description: 'OCI Registry backend kind (ghcr, docker_hub, aws_ecr, gcp_artifact_registry, azure_acr, generic_oci). Leave empty to autodetect from registry host.'
    required: false
    default: ''
  github-token:
    description: 'GitHub token with package write permissions'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Verify Nix Installation
      shell: bash
      run: |
        if ! command -v nix &> /dev/null; then
          echo "::error::Nix is not installed. Please use DeterminateSystems/nix-installer-action before calling this action."
          exit 1
        fi

    - name: Install NixCache Tools
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/../install/install.sh"
        "${{ github.action_path }}/../install/install.sh"

    - name: Run Garbage Collection
      shell: bash
      env:
        NIXCACHE_RETENTION_DAYS: ${{ inputs.retention-days }}
        NIXCACHE_DELETE_BLOBS: ${{ inputs.delete-blobs }}
        NIXCACHE_ALLOW_UNSUPPORTED_BLOB_DELETION: ${{ inputs.allow-unsupported-blob-deletion }}
        NIXCACHE_STRICT: ${{ inputs.strict }}
        NIXCACHE_REPO: ${{ inputs.repo }}
        NIXCACHE_REGISTRY: ${{ inputs.registry }}
        NIXCACHE_REGISTRY_KIND: ${{ inputs.registry-kind }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        EXTRA_ARGS=()
        if [[ "${{ inputs.dry-run }}" == "true" ]]; then
          EXTRA_ARGS+=(--dry-run)
        fi
        if [[ "${{ inputs.delete-blobs }}" == "true" ]]; then
          EXTRA_ARGS+=(--delete-blobs)
        fi
        if [[ "${{ inputs.allow-unsupported-blob-deletion }}" == "true" ]]; then
          EXTRA_ARGS+=(--allow-unsupported-blob-deletion)
        fi
        if [[ "${{ inputs.strict }}" == "false" ]]; then
          EXTRA_ARGS+=(--no-strict)
        fi
        
        nixcache-builder gc --retention-days "$NIXCACHE_RETENTION_DAYS" "${EXTRA_ARGS[@]}"
