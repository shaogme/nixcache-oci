services:
  # Base configuration for the application
  app-base: &app-base
    image: ghcr.io/shaogme/coding-images/rust-wasm:latest
    environment:
      - ROOT_PASSWORD=root # Set your secure password here
      - MISE_YES=1 # Non-interactive mode for mise
      - HOST_UID=${HOST_UID:-1000:1000} # Adaptive UID/GID mapping to avoid file permission conflicts
      - CONTAINER_HOME=${CONTAINER_HOME:-/home/dev} # Default to /home/dev, override with /root for root user
      - CARGO_INCREMENTAL=${CARGO_INCREMENTAL:-0} # Disabled by default for sccache caching compatibility
      - CARGO_TARGET_DIR=/data/.cargo/target # Isolate Rust target directory to persistent data volume
      - RUSTC_WRAPPER=${RUSTC_WRAPPER:-sccache} # Enable sccache compiler wrapper by default
      - SCCACHE_DIR=/data/sccache # Directory for sccache compiler cache storage
      - SCCACHE_DISABLE=${SCCACHE_DISABLE:-0} # Set to 1 to explicitly disable sccache (also supports ENABLE_SCCACHE=0)
    security_opt:
      - seccomp:unconfined # Required for some low-level operations
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
    tty: true

  # Develop mode: Mounts local directory for hot-reloading (Default)
  dev:
    <<: *app-base
    container_name: nixcache-oci-dev
    volumes:
      # Mount host source code
      - .:/workspace
      - /workspace/.git
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      # Isolate Rust build artifacts inside a dedicated named Docker volume (high-performance Linux ext4)
      - rust-target:/data/.cargo/target
      # Persist Cargo dependencies, crate index, and git checkouts
      - cargo-registry:${CONTAINER_HOME:-/home/dev}/.cargo/registry
      - cargo-git:${CONTAINER_HOME:-/home/dev}/.cargo/git
      # Persist sccache compiler cache
      - sccache-cache:/data/sccache
      # Persist direnv data
      - direnv-data:/data/direnv
      # Persist unified AI credentials and tool configurations
      - coding-config:/data/coding-config

volumes:
  rust-target:
  cargo-registry:
  cargo-git:
  sccache-cache:
  mise-cache:
  direnv-data:
  coding-config:
