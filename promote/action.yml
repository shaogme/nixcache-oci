name: 'NixCache OCI Promote Coordinator'
description: 'Promote workflow run session and build receipts into the production baseline cache-index on GHCR'
inputs:
  registry:
    description: 'OCI Registry'
    required: false
    default: 'ghcr.io'
  registry-kind:
    description: 'OCI Registry backend kind (ghcr, docker_hub, aws_ecr, gcp_artifact_registry, azure_acr, generic_oci). Leave empty to autodetect from registry host.'
    required: false
    default: ''
  repo:
    description: 'Target repository name (owner/repo)'
    required: false
    default: ${{ github.repository }}
  run-id:
    description: 'Workflow run ID to promote'
    required: false
    default: ${{ github.run_id }}
  target-tag:
    description: 'Target OCI tag for production baseline'
    required: false
    default: 'cache-index'
  cleanup-session:
    description: 'Clean up workflow run session tag after promotion'
    required: false
    default: 'true'
  receipts-dir:
    description: 'Directory containing Build Receipts'
    required: false
    default: ''
  github-token:
    description: 'GitHub token with package write permissions'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Verify Nix Installation
      shell: bash
      run: |
        if ! command -v nix &> /dev/null; then
          echo "::error::Nix is not installed. Please use DeterminateSystems/nix-installer-action before calling this action."
          exit 1
        fi

    - name: Log in to OCI Registry
      shell: bash
      run: |
        echo "${{ inputs.github-token }}" | docker login ${{ inputs.registry }} -u "${{ github.actor }}" --password-stdin

    - name: Download Build Receipt Artifacts (optional)
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        path: ${{ inputs.receipts-dir != '' && inputs.receipts-dir || format('{0}/receipts', runner.temp) }}
        pattern: 'nixcache-receipt-*'
        merge-multiple: true

    - name: Install NixCache Tools
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/../install/install.sh"
        "${{ github.action_path }}/../install/install.sh"

    - name: Promote Session & Receipts to Baseline
      shell: bash
      env:
        NIXCACHE_RUN_ID: ${{ inputs.run-id }}
        NIXCACHE_RECEIPTS_DIR: ${{ inputs.receipts-dir != '' && inputs.receipts-dir || format('{0}/receipts', runner.temp) }}
        NIXCACHE_TARGET_TAG: ${{ inputs.target-tag }}
        NIXCACHE_REPO: ${{ inputs.repo }}
        NIXCACHE_REGISTRY: ${{ inputs.registry }}
        NIXCACHE_REGISTRY_KIND: ${{ inputs.registry-kind }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        EXTRA_ARGS=()
        if [[ "${{ inputs.cleanup-session }}" == "false" ]]; then
          EXTRA_ARGS+=(--no-cleanup-session)
        fi
        nixcache-builder promote "${EXTRA_ARGS[@]}"
