name: 'NixCache OCI Build Worker'
description: 'Build Nix targets on this matrix runner, upload NAR blobs to GHCR, and output a Build Receipt artifact'
inputs:
  system:
    description: 'Target platform system architecture (e.g., x86_64-linux, aarch64-linux)'
    required: false
    default: ''
  mode:
    description: 'Build mode: "flake" or "non-flake"'
    required: true
    default: 'flake'
  flake-path:
    description: 'Path to the directory containing flake.nix (only for mode: flake)'
    required: false
    default: '.'
  file:
    description: 'Nix file to build (only for mode: non-flake)'
    required: false
    default: 'default.nix'
  attributes:
    description: 'Space-separated list of attribute paths to build (only for mode: non-flake)'
    required: false
    default: ''
  registry:
    description: 'OCI Registry to push cache to'
    required: false
    default: 'ghcr.io'
  registry-kind:
    description: 'OCI Registry backend kind (ghcr, docker_hub, aws_ecr, gcp_artifact_registry, azure_acr, generic_oci). Leave empty to autodetect from registry host.'
    required: false
    default: ''
  repo:
    description: 'Target repository name (owner/repo)'
    required: false
    default: ${{ github.repository }}
  signing-key:
    description: 'Nix secret key used to sign store paths'
    required: false
    default: ''
  fail-fast:
    description: 'Fail fast if self-substituter proxy fails to start or become ready'
    required: false
    default: 'true'
  export-concurrency:
    description: 'Parallel export concurrency level (default: autodetect based on CPU cores, clamp(2, 8))'
    required: false
    default: ''
  github-token:
    description: 'GitHub token with package write permissions'
    required: false
    default: ${{ github.token }}
  run-id:
    description: 'Workflow run ID for Tier 1 session'
    required: false
    default: ${{ github.run_id }}
  receipt-name:
    description: 'Artifact name for the generated build receipt'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Verify Nix Installation
      shell: bash
      run: |
        if ! command -v nix &> /dev/null; then
          echo "::error::Nix is not installed. Please use DeterminateSystems/nix-installer-action before calling this action."
          exit 1
        fi

    - name: Setup signing key
      shell: bash
      run: |
        if [[ -n "${{ inputs.signing-key }}" ]]; then
          echo "${{ inputs.signing-key }}" > "$RUNNER_TEMP/signing-key"
          echo "NIXCACHE_SIGNING_KEY_FILE=$RUNNER_TEMP/signing-key" >> "$GITHUB_ENV"
          echo ">>> Nix signing key configured"
        else
          echo ">>> No signing key configured — cache will be unsigned"
        fi

    - name: Log in to OCI Registry
      shell: bash
      run: |
        echo "${{ inputs.github-token }}" | docker login ${{ inputs.registry }} -u "${{ github.actor }}" --password-stdin

    - name: Build outputs and push NAR blobs
      shell: bash
      env:
        NIXCACHE_SYSTEM: ${{ inputs.system }}
        NIXCACHE_MODE: ${{ inputs.mode }}
        NIXCACHE_FLAKE_PATH: ${{ inputs.flake-path }}
        NIXCACHE_FILE: ${{ inputs.file }}
        NIXCACHE_ATTRIBUTES: ${{ inputs.attributes }}
        NIXCACHE_REPO: ${{ inputs.repo }}
        NIXCACHE_REGISTRY: ${{ inputs.registry }}
        NIXCACHE_REGISTRY_KIND: ${{ inputs.registry-kind }}
        NIXCACHE_FAIL_FAST: ${{ inputs.fail-fast }}
        NIXCACHE_EXPORT_CONCURRENCY: ${{ inputs.export-concurrency }}
        NIXCACHE_RUN_ID: ${{ inputs.run-id }}
        NIXCACHE_OUTPUT_RECEIPT: ${{ runner.temp }}/receipt.json
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        REF=""
        if [[ -f .nixcache-version ]]; then
          REF=$(cat .nixcache-version | tr -d '[:space:]')
          if [[ -n "$REF" ]]; then
            echo ">>> Found .nixcache-version file, using version: $REF"
          fi
        fi
        if [[ -z "$REF" ]]; then
          REF="${{ github.action_ref }}"
          if [[ -z "$REF" ]]; then
            REF="main"
          fi
          echo ">>> Using fallback version: $REF"
        fi
        nix run --accept-flake-config "github:shaogme/nixcache-oci/$REF#cache-builder-bin" -- build

    - name: Upload Build Receipt Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.receipt-name != '' && inputs.receipt-name || (inputs.system != '' && format('nixcache-receipt-{0}', inputs.system) || format('nixcache-receipt-{0}', runner.os)) }}
        path: ${{ runner.temp }}/receipt.json
        retention-days: 1
        overwrite: true
