[package]
name = "nixcache-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Workspace crates
nixcache-core = { workspace = true }
nixcache-oci = { workspace = true }

# Worker runtime & networking
bytes = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
worker = { version = "0.8.5", features = ["http"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Concurrency & State
arc-swap = { workspace = true }
scc = { workspace = true }

# Utilities & Error handling
base64 = { workspace = true }
thiserror = { workspace = true }
