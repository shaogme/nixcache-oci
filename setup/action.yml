name: 'NixCache OCI Setup & Session Init'
description: 'Initialize local NixCache cascading proxy daemon, configure nix.conf, and snapshot store state'
inputs:
  registry:
    description: 'OCI Registry to fetch/push cache'
    required: false
    default: 'ghcr.io'
  registry-kind:
    description: 'OCI Registry backend kind (ghcr, docker_hub, aws_ecr, gcp_artifact_registry, azure_acr, generic_oci). Leave empty to autodetect from registry host.'
    required: false
    default: ''
  repo:
    description: 'Target repository name (owner/repo)'
    required: false
    default: ${{ github.repository }}
  run-id:
    description: 'Workflow run ID for Tier 1 session'
    required: false
    default: ${{ github.run_id }}
  branch:
    description: 'Branch name or PR number for Tier 2 session'
    required: false
    default: ${{ github.ref_name }}
  signing-key:
    description: 'Nix secret key used to sign store paths'
    required: false
    default: ''
  session-ttl:
    description: 'Session index TTL in seconds'
    required: false
    default: '10'
  baseline-ttl:
    description: 'Baseline index TTL in seconds'
    required: false
    default: '300'
  baseline-tag:
    description: 'Baseline production tag'
    required: false
    default: 'cache-index'
  upstream:
    description: 'Upstream binary cache URLs'
    required: false
    default: 'https://cache.nixos.org'
  github-token:
    description: 'GitHub token with package read/write permissions'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Verify Nix Installation
      shell: bash
      run: |
        if ! command -v nix &> /dev/null; then
          echo "::error::Nix is not installed. Please use DeterminateSystems/nix-installer-action before calling this action."
          exit 1
        fi

    - name: Setup signing key
      shell: bash
      run: |
        if [[ -n "${{ inputs.signing-key }}" ]]; then
          echo "${{ inputs.signing-key }}" > "$RUNNER_TEMP/signing-key"
          echo "NIXCACHE_SIGNING_KEY_FILE=$RUNNER_TEMP/signing-key" >> "$GITHUB_ENV"
          echo ">>> Nix signing key configured"
        fi

    - name: Install NixCache Tools
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/../install/install.sh"
        "${{ github.action_path }}/../install/install.sh"

    - name: Initialize NixCache Session & Proxy
      shell: bash
      env:
        NIXCACHE_REPO: ${{ inputs.repo }}
        NIXCACHE_REGISTRY: ${{ inputs.registry }}
        NIXCACHE_REGISTRY_KIND: ${{ inputs.registry-kind }}
        NIXCACHE_RUN_ID: ${{ inputs.run-id }}
        NIXCACHE_BRANCH: ${{ inputs.branch }}
        NIXCACHE_SESSION_TTL: ${{ inputs.session-ttl }}
        NIXCACHE_BASELINE_TTL: ${{ inputs.baseline-ttl }}
        NIXCACHE_BASELINE_TAG: ${{ inputs.baseline-tag }}
        NIXCACHE_UPSTREAM: ${{ inputs.upstream }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        nixcache-builder session init
